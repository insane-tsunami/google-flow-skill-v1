[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
# Legacy canvas/wait helpers are outside the public durable pipeline.
extend-exclude = ["setup.py", "flow_provider/canvas.py", "flow_provider/wait.py", "flow_provider/registry.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
